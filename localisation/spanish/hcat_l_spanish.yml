l_spanish:
 hcat_catalan_question:0 "La cuestión catalana"
 hcat_catalan_question_desc:0 "La relación entre Cataluña y el Estado español sigue sin resolverse.\n\nAutonomía catalana: §Y[?global.hcat_autonomy|0]§! / 100\n§YMínimo garantizado:§! [?global.hcat_autonomy_floor|0]"
 hcat_debug_raise_autonomy:0 "[DEBUG] Aumentar la autonomía catalana"
 hcat_debug_lower_autonomy:0 "[DEBUG] Reducir la autonomía catalana"
 CAT_the_catalan_question:0 "La cuestión catalana"
 CAT_the_catalan_question_desc:0 "Cataluña debe decidir su lugar dentro o fuera de España."
 CAT_the_road_to_independence:0 "El camino a la independencia"
 CAT_the_road_to_independence_desc:0 "Solo una Cataluña soberana puede asegurar el futuro de la nación catalana."
 CAT_mediterranean_democracy:0 "Una democracia mediterránea"
 CAT_mediterranean_democracy_desc:0 "Una república libre, abierta al mar y a las democracias de Europa."
 CAT_restore_the_crown_of_aragon:0 "Restaurar la Corona de Aragón"
 CAT_restore_the_crown_of_aragon_desc:0 "Las tierras de la antigua Corona volverán a unirse."
 CAT_home_of_anarchy:0 "Hogar de la anarquía"
 CAT_home_of_anarchy_desc:0 "Barcelona, la rosa de fuego, mostrará al mundo una sociedad sin amos."
 CAT_within_spain:0 "Dentro de España"
 CAT_within_spain_desc:0 "Los intereses de Cataluña se defienden mejor con su autonomía dentro del Estado español."
 hcat_autonomy_autonomous_community:0 "Comunidad autónoma"
 CAT_hcat_autonomy_autonomous_community:0 "Generalitat de Catalunya"
 CAT_hcat_autonomy_autonomous_community_DEF:0 "la Generalitat de Catalunya"
 hcat_catalonia_is_our_subject_tt:0 "§YCataluña§! es nuestro súbdito"
 hcat_autonomy_low_enough_to_integrate_tt:0 "La autonomía catalana es como máximo §Y25§! (actualmente §Y[?global.hcat_autonomy|0]§!)"
 hcat_catalan_discontent_country:0 "Descontento catalán"
 hcat_catalan_discontent_state:0 "Descontento catalán"
 SPR_hcat_the_catalan_question:0 "La cuestión catalana"
 SPR_hcat_the_catalan_question_desc:0 "Barcelona se gobierna a sí misma bajo el Estatuto de 1932. Ningún gobierno español puede eludir la pregunta de si ese acuerdo fortalece España o la divide."
 SPR_hcat_the_generalitat_and_the_republic:0 "La Generalitat y la República"
 SPR_hcat_the_generalitat_and_the_republic_desc:0 "La República otorgó a Cataluña su Estatuto. Ahora debe decidir qué es para ella la Generalitat: un socio o un rival."
 SPR_hcat_honour_the_statute:0 "Respetar el Estatuto"
 SPR_hcat_honour_the_statute_desc:0 "La República cumple su palabra. Las competencias de la Generalitat se respetarán por completo."
 SPR_hcat_partners_in_the_war_effort:0 "Socios en el esfuerzo de guerra"
 SPR_hcat_partners_in_the_war_effort_desc:0 "La industria catalana, organizada por la Generalitat, armará a la República."
 SPR_hcat_recentralise_the_republic:0 "Recentralizar la República"
 SPR_hcat_recentralise_the_republic_desc:0 "Una República dividida no puede vencer. La autoridad debe volver al gobierno central."
 SPR_hcat_restore_public_order:0 "Restablecer el orden público en Barcelona"
 SPR_hcat_restore_public_order_desc:0 "Las calles de Barcelona responden a demasiados amos. La Guardia de Asalto asumirá el orden público en lugar de la Generalitat."
 SPR_hcat_against_separatism:0 "Contra el separatismo"
 SPR_hcat_against_separatism_desc:0 "España es una sola nación. El separatismo catalán es enemigo de la Patria."
 SPR_hcat_abolish_the_statute:0 "Abolir el Estatuto"
 SPR_hcat_abolish_the_statute_desc:0 "Se revoca el Estatuto de Autonomía y se disuelve la Generalitat."
 SPR_hcat_one_spain:0 "Una sola España"
 SPR_hcat_one_spain_desc:0 "Un Estado, una lengua, una administración desde Madrid."
 SPR_hcat_integrate_catalonia:0 "Integrar Cataluña"
 SPR_hcat_integrate_catalonia_desc:0 "Cataluña se gobernará como cualquier otra parte de España. El resentimiento perdurará durante años."
 hcat_autonomy_change_tt:0 "Autonomía catalana: $RIGHT|+0$"
 CAT_mobilise_civil_society:0 "Movilizar la sociedad civil"
 CAT_mobilise_civil_society_desc:0 "Òmnium, los ateneos y los sindicatos: la sociedad catalana debe apoyar la causa del autogobierno."
 CAT_proclaim_the_catalan_state:0 "Proclamar el Estado catalán"
 CAT_proclaim_the_catalan_state_desc:0 "Desde el balcón del Palau de la Generalitat se proclama el Estado catalán. Madrid debe responder."
 CAT_the_statute_defended:0 "El Estatuto defendido"
 CAT_the_statute_defended_desc:0 "El Estatuto es la garantía del pueblo catalán. Cualquier gobierno de Madrid que lo toque se enfrentará a toda Cataluña."
 CAT_industry_of_the_republic:0 "Industria de la República"
 CAT_industry_of_the_republic_desc:0 "Dentro de España, la industria catalana puede crecer con acceso a los mercados españoles."
 hcat_unlocks_mobilise_decision_tt:0 "Desbloquea la decisión §YMovilizar la sociedad civil§!."
 hcat_autonomy_high_enough_to_proclaim_tt:0 "La autonomía catalana es como mínimo §Y80§! (actualmente §Y[?global.hcat_autonomy|0]§!)"
 hcat_autonomy_floor_30_tt:0 "La autonomía catalana ya no puede bajar de §Y30§! mientras el Estatuto siga en pie."
 hcat_autonomy_floor_40_tt:0 "La autonomía catalana ya no puede bajar de §Y40§! mientras el Estatuto siga en pie."
 hcat_break_the_statute_pact_tt:0 "§RRompe la garantía del Estatuto:§! la autonomía catalana deja de estar protegida."
 hcat_proclaim_the_catalan_state_tt:0 "§YEspaña§! debe decidir si acepta el Estado catalán o lo aplasta."
 hcat_negotiate_competences:0 "Negociar competencias"
 hcat_negotiate_competences_desc:0 "Presionar a Madrid para que transfiera nuevas competencias a la Generalitat."
 hcat_mobilise_civil_society:0 "Movilizar la sociedad civil"
 hcat_mobilise_civil_society_desc:0 "Concentraciones, huelgas y peticiones muestran a Madrid que Cataluña no retrocederá."
 hcat_spain.1.t:0 "Cataluña proclama el Estado catalán"
 hcat_spain.1.desc:0 "El presidente de la Generalitat ha proclamado el Estado catalán desde el balcón del Palau, ante una multitud que lo aclama en la plaza de Sant Jaume. Cataluña ya no reconoce la autoridad del gobierno español.\n\nPodemos aceptarlo y negociar la separación, o enviar al ejército para restablecer la unidad de España."
 hcat_spain.1.a:0 "Dejar marchar a Cataluña."
 hcat_spain.1.b:0 "¡La unidad de España no se negocia!"
 hcat_catalonia.1.t:0 "Madrid acepta"
 hcat_catalonia.1.desc:0 "Para sorpresa de muchos, el gobierno español ha aceptado la proclamación. Cataluña es libre de trazar su propio camino."
 hcat_catalonia.1.a:0 "Visca Catalunya lliure!"
 hcat_catalonia.2.t:0 "Madrid envía al ejército"
 hcat_catalonia.2.desc:0 "El gobierno español se niega a reconocer el Estado catalán y sus tropas marchan sobre Cataluña. Nuestra independencia habrá que ganarla."
 hcat_catalonia.2.a:0 "¡A las armas!"
 hcat_catalonia.3.t:0 "El Estatuto traicionado"
 hcat_catalonia.3.desc:0 "Madrid ha roto las garantías del Estatuto de Autonomía. El autogobierno que defendimos queda a merced del gobierno español."
 hcat_catalonia.3.a:0 "No lo olvidaremos."
 CAT_the_parliament_of_catalonia:0 "El Parlamento de Cataluña"
 CAT_the_parliament_of_catalonia_desc:0 "El Parlamento elegido bajo el Estatuto es ahora la voz soberana del pueblo catalán. Sus sesiones deben dar a la nueva república unos cimientos firmes."
 CAT_the_rabassaires_law:0 "La Ley de los Rabassaires"
 CAT_the_rabassaires_law_desc:0 "La Ley de Contratos de Cultivo, anulada por Madrid en 1934, por fin puede entrar en vigor. Los aparceros de las viñas serán dueños de la tierra que trabajan."
 CAT_a_republic_of_citizens:0 "Una república de ciudadanos"
 CAT_a_republic_of_citizens_desc:0 "Escuelas, prensa libre y libertades civiles: la República Catalana la construirán sus ciudadanos, no se impondrá a sus súbditos."
 CAT_the_port_of_barcelona:0 "El puerto de Barcelona"
 CAT_the_port_of_barcelona_desc:0 "Barcelona siempre ha vivido del mar. Su puerto y sus astilleros serán la puerta del nuevo Estado."
 CAT_the_factory_of_the_mediterranean:0 "La fábrica del Mediterráneo"
 CAT_the_factory_of_the_mediterranean_desc:0 "Cataluña fue la fábrica de España. Libre de los aranceles de Madrid, puede ser la fábrica de todo el Mediterráneo."
 CAT_mediterranean_trade:0 "Comercio mediterráneo"
 CAT_mediterranean_trade_desc:0 "De Marsella a Alejandría, los mercaderes catalanes dominaron estas aguas. Nuevos tratados volverán a abrir las viejas rutas."
 CAT_seek_recognition:0 "Buscar el reconocimiento internacional"
 CAT_seek_recognition_desc:0 "Un Estado existe cuando los demás lo tratan como tal. Nuestros enviados llamarán a las puertas de las democracias de Europa y América."
 CAT_the_army_of_catalonia:0 "El Ejército de Cataluña"
 CAT_the_army_of_catalonia_desc:0 "Las milicias y los Mossos d'Esquadra deben convertirse en un verdadero ejército de ciudadanos soldados leales a la república."
 CAT_hold_the_ebro_and_the_pyrenees:0 "Defender el Ebro y los Pirineos"
 CAT_hold_the_ebro_and_the_pyrenees_desc:0 "Una nación pequeña sobrevive haciendo que invadirla salga caro. Se fortificarán las líneas del río y los pasos de montaña."
 CAT_entente_with_france:0 "Entente con Francia"
 CAT_entente_with_france_desc:0 "París es nuestro amigo más cercano y nuestro vecino más fuerte. Una alianza con Francia mantendrá a raya las ambiciones de Madrid."
 CAT_the_mediterranean_accord:0 "El Acuerdo Mediterráneo"
 CAT_the_mediterranean_accord_desc:0 "No seremos el socio menor de nadie. Las pequeñas democracias del Mediterráneo pueden unirse en sus propios términos."
 CAT_the_beacon_of_the_mediterranean:0 "El faro del Mediterráneo"
 CAT_the_beacon_of_the_mediterranean_desc:0 "Próspera, libre y segura, Cataluña demuestra que una nación pequeña puede ser una gran democracia."
 hcat_fragile_republic:0 "Una república frágil"
 hcat_fragile_republic_desc:0 "La nueva República Catalana tiene instituciones sobre el papel, pero pocas han sido puestas a prueba. Las facciones discuten y la administración aún aprende a gobernar un Estado."
 hcat_republic_finds_its_feet:0 "La república se asienta"
 hcat_republic_finds_its_feet_desc:0 "El Parlamento se reúne, se aprueban leyes y los ministerios toman forma. La república aún es joven, pero funciona."
 hcat_a_republic_of_citizens:0 "Una república de ciudadanos"
 hcat_a_republic_of_citizens_desc:0 "Los catalanes sienten la república como suya. Sus instituciones gozan de confianza y sus ciudadanos están dispuestos a defenderlas."
 hcat_the_rabassaires_law:0 "La Ley de los Rabassaires"
 hcat_the_rabassaires_law_desc:0 "Los aparceros tienen asegurada la tierra que trabajan, y el campo es leal a la república que se la dio."
 hcat_mediterranean_trade_routes:0 "Rutas comerciales mediterráneas"
 hcat_mediterranean_trade_routes_desc:0 "Los productos catalanes circulan por los puertos del Mediterráneo, y el capital extranjero vuelve a Barcelona."
 hcat_a_citizen_army:0 "Un ejército de ciudadanos"
 hcat_a_citizen_army_desc:0 "Los soldados de Cataluña saben por qué luchan: por sus hogares y por su república."
 hcat_recognised_the_catalan_republic:0 "Reconoció la República Catalana"
 hcat_the_mediterranean_accord:0 "El Acuerdo Mediterráneo"
 hcat_raise_the_catalan_forces_tt:0 "§YSe levantan las fuerzas catalanas en Barcelona:§!\n- 3 divisiones de §YMilícies Catalanes§!\n- 2 divisiones de §YMossos d'Esquadra§! con policía militar\n- La división de montaña §YRegiment Pirinenc núm. 1§!"
 CAT_the_count_of_barcelona:0 "El conde de Barcelona"
 CAT_the_count_of_barcelona_desc:0 "Los reyes de Aragón fueron ante todo condes de Barcelona. La Corona restaurada necesita un conde-rey, y más de una casa reclama el título."
 CAT_the_corts_generals:0 "Las Cortes Generales"
 CAT_the_corts_generals_desc:0 "Durante siglos el rey no pudo gobernar sin las Cortes, donde los estamentos de cada reino votaban sus impuestos y sus leyes. La Corona restaurada volverá a estar sujeta a ellas."
 CAT_the_usatges_of_barcelona:0 "Los Usatges de Barcelona"
 CAT_the_usatges_of_barcelona_desc:0 "El antiguo derecho consuetudinario del Principado da a la Corona sus derechos sobre sus tierras. Los juristas de Barcelona buscan precedentes para cada reclamación."
 CAT_the_lands_of_the_crown:0 "Las tierras de la Corona"
 CAT_the_lands_of_the_crown_desc:0 "Aragón, Valencia y Mallorca fueron reinos de la Corona mucho antes de que existiera España. Su lugar está con nosotros."
 CAT_reclaim_aragon:0 "Recuperar Aragón"
 CAT_reclaim_aragon_desc:0 "Zaragoza fue sede de los reyes de la Corona. Aragón debe volver a la Corona que lleva su nombre."
 CAT_reclaim_valencia_and_the_isles:0 "Recuperar Valencia y las islas"
 CAT_reclaim_valencia_and_the_isles_desc:0 "El Reino de Valencia y el Reino de Mallorca hablan nuestra lengua y comparten nuestra historia. Volverán a formar parte de la Corona."
 CAT_the_crown_united:0 "La Corona unida"
 CAT_the_crown_united_desc:0 "Por primera vez desde 1714, las tierras de la Corona de Aragón son libres y se gobiernan desde un solo trono."
 CAT_the_almogavars:0 "Los almogávares"
 CAT_the_almogavars_desc:0 "Los almogávares, la infantería ligera de la Corona, se abrieron paso desde los Pirineos hasta Atenas. Nuestros soldados se formarán en su espíritu."
 CAT_the_consulate_of_the_sea:0 "El Consulado del Mar"
 CAT_the_consulate_of_the_sea_desc:0 "El Llibre del Consolat de Mar fue el derecho marítimo de todo el Mediterráneo. Barcelona volverá a ser una potencia en el mar."
 CAT_northern_catalonia:0 "Cataluña Norte"
 CAT_northern_catalonia_desc:0 "El Rosellón fue entregado a Francia en 1659 por un tratado que ningún catalán firmó. Los condados al norte de los Pirineos siguen siendo catalanes."
 CAT_the_mediterranean_kingdoms:0 "Los reinos mediterráneos"
 CAT_the_mediterranean_kingdoms_desc:0 "Cerdeña, Sicilia y Nápoles fueron gobernadas desde Barcelona. La Corona recordará sus antiguos reinos al otro lado del mar."
 CAT_the_crown_of_aragon_reborn:0 "El renacer de la Corona de Aragón"
 CAT_the_crown_of_aragon_reborn_desc:0 "La Corona está restaurada en sus tierras, sus leyes y su mar. Las cuatro barras ondean de nuevo sobre el Mediterráneo."
 CAT_juan_de_borbon:0 "Juan de Borbón"
 hcat_a_disputed_crown:0 "Una corona disputada"
 hcat_a_disputed_crown_desc:0 "Muchos en Cataluña dudan de que una corona medieval pueda restaurarse en el siglo XX, y republicanos y monárquicos se miran con recelo."
 hcat_the_corts_of_the_crown:0 "Las Cortes de la Corona"
 hcat_the_corts_of_the_crown_desc:0 "El rey gobierna con las Cortes, y las Cortes con el rey. El antiguo pacto da legitimidad a la monarquía restaurada."
 hcat_the_crown_of_aragon_reborn:0 "El renacer de la Corona de Aragón"
 hcat_the_crown_of_aragon_reborn_desc:0 "La Corona está restaurada y su pueblo se enorgullece de ella."
 hcat_the_usatges_of_barcelona:0 "Los Usatges de Barcelona"
 hcat_the_usatges_of_barcelona_desc:0 "El antiguo derecho da a la Corona un título sobre cada tierra que gobernó, y a su pueblo la voluntad de reclamarlas."
 hcat_the_almogavars:0 "Los almogávares"
 hcat_the_almogavars_desc:0 "Los soldados catalanes se entrenan para golpear rápido y fuerte, como los almogávares de antaño."
 hcat_the_consulate_of_the_sea:0 "El Consulado del Mar"
 hcat_the_consulate_of_the_sea_desc:0 "Los astilleros y mercaderes de Barcelona vuelven a ser el corazón del comercio mediterráneo."
 hcat_choose_a_claimant_tt:0 "§YLas Cortes coronarán al pretendiente con más apoyos.§! Mientras el foco esté en curso, varios eventos te permitirán influir en ellas."
 CAT_ramon_berenguer:0 "Ramon Berenguer de Barcelona"
 CAT_otto_von_habsburg:0 "Otto de Habsburgo"
 CAT_jaume_d_urgell:0 "Jaume d'Urgell"
 hcat_catalonia.4.t:0 "Las Cortes han decidido"
 hcat_catalonia.4.a:0 "¡Viva el rey Juan!"
 hcat_catalonia.4.b:0 "¡Viva el conde-rey!"
 hcat_catalonia.4.c:0 "¡Viva el rey Otto!"
 hcat_catalonia.4.d:0 "¡Viva el rey Jaume!"
 hcat_house_of_bourbon:0 "Un Borbón conde de Barcelona"
 hcat_house_of_bourbon_desc:0 "Un Borbón ocupa el trono de Barcelona. Madrid está tranquila, pero muchos catalanes no han olvidado 1714."
 hcat_house_of_barcelona:0 "La Casa de Barcelona refundada"
 hcat_house_of_barcelona_desc:0 "Un catalán vuelve a llevar la Corona, elegido por las Cortes como en tiempos de los condes. La nación se une a él, aunque su corte es pequeña y su tesoro aún más."
 hcat_house_of_habsburg:0 "El candidato austracista"
 hcat_house_of_habsburg_desc:0 "Con dos siglos de retraso, la pretensión de los Habsburgo por la que luchó Cataluña se ha cumplido. Oficiales y cortesanos austriacos han seguido al nuevo rey, pero para muchos es un extranjero."
 hcat_house_of_urgell:0 "El heredero de Urgell"
 hcat_house_of_urgell_desc:0 "La injusticia de Caspe ha sido reparada, y el nuevo rey pretende recuperar todo lo que la Corona perdió. No todos están convencidos de su genealogía."
 hcat_a_bourbon_in_barcelona:0 "Un Borbón en Barcelona"
 hcat_a_habsburg_in_barcelona:0 "Un Habsburgo en Barcelona"
 hcat_habsburg_restoration:0 "Restauración de los Habsburgo"
 hcat_claim_bourbon_tt:0 "Apoyo a la Casa de Borbón: $RIGHT|+0$"
 hcat_claim_barcelona_tt:0 "Apoyo a la Casa de Barcelona: $RIGHT|+0$"
 hcat_claim_habsburg_tt:0 "Apoyo a la Casa de Habsburgo: $RIGHT|+0$"
 hcat_claim_urgell_tt:0 "Apoyo a la Casa de Urgell: $RIGHT|+0$"
 hcat_catalonia.4.desc_bourbon:0 "Tras semanas de debate, las Cortes han ofrecido la Corona a Juan de Borbón, conde de Barcelona. Un Borbón volverá a reinar en Barcelona, y Madrid ha enviado sus felicitaciones."
 hcat_catalonia.4.desc_barcelona:0 "Las Cortes han rechazado toda casa extranjera. Como en tiempos de los primeros condes, han elegido a uno de los suyos: Ramon Berenguer de Barcelona refundará la Casa de Barcelona."
 hcat_catalonia.4.desc_habsburg:0 "Dos siglos después de que Cataluña luchara por el archiduque Carlos, las Cortes han ofrecido la Corona a su heredero. Otto de Habsburgo ya viaja desde Bélgica."
 hcat_catalonia.4.desc_urgell:0 "Las Cortes han votado deshacer el Compromiso de Caspe. El heredero de Jaume d'Urgell, el conde relegado en 1412, ocupará por fin el trono que se negó a su linaje."
 hcat_crown.1.t:0 "Enviados del conde de Barcelona"
 hcat_crown.1.desc:0 "Han llegado a Barcelona enviados de Juan de Borbón. El conde, dicen, respetaría las libertades de la Corona y traería consigo la buena voluntad de Madrid.\n\nNo todos están convencidos: fue el primer rey Borbón quien abolió esas mismas libertades en 1714.\n\n§YApoyos en las Cortes§!\nBorbón: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburgo: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.1.a:0 "Recibirlos con honores."
 hcat_crown.1.b:0 "Recordarles 1714."
 hcat_crown.2.t:0 "Una carta desde Steenokkerzeel"
 hcat_crown.2.desc:0 "Desde su exilio en Bélgica, Otto de Habsburgo ha escrito a las Cortes. Recuerda que Cataluña apoyó a su casa en la Guerra de Sucesión y se ofrece a terminar lo que empezó el archiduque Carlos.\n\n§YApoyos en las Cortes§!\nBorbón: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburgo: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.2.a:0 "Publicar la carta en la prensa."
 hcat_crown.2.b:0 "Archivarla con cortesía."
 hcat_crown.3.t:0 "La disputa de los historiadores"
 hcat_crown.3.desc:0 "En el Institut d'Estudis Catalans, los historiadores no se ponen de acuerdo. Unos llaman usurpación al Compromiso de Caspe y ven en el heredero de Urgell al rey legítimo. Otros dicen que los primeros condes fueron elegidos por su pueblo y que las Cortes pueden volver a elegir. Un tercer grupo dice solo que una corona necesita una casa real.\n\n§YApoyos en las Cortes§!\nBorbón: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburgo: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.3.a:0 "Caspe fue una usurpación."
 hcat_crown.3.b:0 "Los primeros condes fueron elegidos por su pueblo."
 hcat_crown.3.c:0 "Una corona necesita una casa real, no una teoría."
 hcat_crown.4.t:0 "Hablan los industriales"
 hcat_crown.4.desc:0 "El Foment del Treball Nacional, voz de los industriales de Barcelona, quiere un rey con amigos en el extranjero que mantenga abiertos los mercados. Los radicales de las Cortes responden que Cataluña no se liberó para ser gobernada desde una corte extranjera.\n\n§YApoyos en las Cortes§!\nBorbón: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburgo: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.4.a:0 "Ponerse del lado de los industriales."
 hcat_crown.4.b:0 "Ponerse del lado de los radicales."
 hcat_crown.5.t:0 "Las Cortes deliberan"
 hcat_crown.5.desc:0 "Las Cortes votarán en pocos días. El gobierno puede dejar que los diputados decidan libremente o usar su influencia para ganar votos para una casa.\n\n§YApoyos en las Cortes§!\nBorbón: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburgo: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.5.a:0 "Dejar que las Cortes voten libremente."
 hcat_crown.5.b:0 "Ganar votos para la Casa de Borbón."
 hcat_crown.5.c:0 "Ganar votos para la Casa de Barcelona."
 hcat_crown.5.d:0 "Ganar votos para la Casa de Habsburgo."
 hcat_crown.5.e:0 "Ganar votos para la Casa de Urgell."
 CAT_libertarian_communism:0 "El comunismo libertario"
 CAT_libertarian_communism_desc:0 "El congreso de la CNT en Zaragoza fijó el objetivo en mayo: comunas libres, federadas desde abajo, sin Estado por encima. En Cataluña, ese objetivo ya está al alcance."
 CAT_the_modern_school:0 "La Escuela Moderna"
 CAT_the_modern_school_desc:0 "Francesc Ferrer i Guàrdia fundó su Escola Moderna racionalista en Barcelona en 1901 y fue fusilado por ello. Sus escuelas volverán a abrir, libres de Iglesia y de Estado."
 CAT_mujeres_libres:0 "Mujeres Libres"
 CAT_mujeres_libres_desc:0 "Las Mujeres Libres se organizan en las fábricas y en los barrios. Una revolución que deja atrás a la mitad del pueblo no es una revolución."
 CAT_the_free_federation:0 "La Federación Libre"
 CAT_the_free_federation_desc:0 "Comités, colectividades y comunas se unen en una sola federación libre. Cataluña se gobierna desde abajo."
 CAT_the_collectives:0 "Las colectividades"
 CAT_the_collectives_desc:0 "Los patronos han huido y los trabajadores se han hecho cargo de las fábricas, los tranvías y la Telefónica. Las gestionarán ellos mismos."
 CAT_the_council_of_economy:0 "El Consejo de Economía"
 CAT_the_council_of_economy_desc:0 "El Consell d'Economia de Catalunya coordinará las colectividades para que cada fábrica sepa qué necesitan las demás."
 CAT_the_war_industries_commission:0 "La Comisión de Industrias de Guerra"
 CAT_the_war_industries_commission_desc:0 "Las fábricas textiles y de automóviles pueden producir fusiles y obuses. La Comissió d'Indústries de Guerra armará la revolución."
 CAT_the_supply_committees:0 "Los comités de abastos"
 CAT_the_supply_committees_desc:0 "Los comités de barrio se asegurarán de que el pan y el carbón lleguen a cada casa, sin especuladores de por medio."
 CAT_the_militia_columns:0 "Las columnas de milicias"
 CAT_the_militia_columns_desc:0 "Los obreros que asaltaron los cuarteles en julio han formado sus propias columnas. Eligen a sus delegados y no necesitan generales."
 CAT_the_aragon_front:0 "El frente de Aragón"
 CAT_the_aragon_front_desc:0 "Las columnas marchan hacia el oeste, y en cada pueblo aragonés al que llegan los campesinos fundan sus propias colectividades."
 CAT_the_antifascist_front:0 "El Frente Antifascista"
 CAT_the_antifascist_front_desc:0 "El fascismo es enemigo de todo pueblo libre. Estaremos con quien lo combata."
 CAT_the_international_workers_association:0 "La Asociación Internacional de los Trabajadores"
 CAT_the_international_workers_association_desc:0 "Nuestra revolución pertenece a los trabajadores del mundo. A través de la AIT, compañeros de todos los países vendrán a luchar con nosotros, e iremos a luchar con ellos."
 CAT_the_rose_of_fire:0 "La rosa de fuego"
 CAT_the_rose_of_fire_desc:0 "Barcelona, la rosa de foc, ha demostrado al mundo que una sociedad sin amos puede funcionar, y luchar."
 CAT_the_central_committee_of_militias:0 "Comité Central de Milicias Antifascistas"
 hcat_raise_the_militia_columns_tt:0 "§YSe levantan las columnas en Barcelona:§! §YColumna Durruti§!, §YColumna Ascaso§! y §YColumna Ortiz§!."
 hcat_the_july_revolution:0 "La revolución de julio"
 hcat_the_july_revolution_desc:0 "El viejo orden se hundió en unos pocos días de lucha callejera. Los comités dirigen la ciudad, pero nadie sabe quién manda."
 hcat_the_free_communes:0 "Las comunas libres"
 hcat_the_free_communes_desc:0 "Pueblos y barrios se gobiernan en asambleas abiertas. Es lento y conflictivo, pero funciona."
 hcat_the_free_federation:0 "La Federación Libre"
 hcat_the_free_federation_desc:0 "Las comunas están federadas y la revolución tiene la estructura que necesita para durar."
 hcat_the_rose_of_fire:0 "La rosa de fuego"
 hcat_the_rose_of_fire_desc:0 "La Cataluña revolucionaria está unida, produce y está lista para defenderse."
 hcat_the_modern_school:0 "La Escuela Moderna"
 hcat_the_modern_school_desc:0 "Las escuelas racionalistas enseñan a los niños a pensar por sí mismos, y las universidades están abiertas a los trabajadores."
 hcat_mujeres_libres:0 "Mujeres Libres"
 hcat_mujeres_libres_desc:0 "Las mujeres trabajan en las fábricas, sirven en las milicias y forman parte de los comités."
 hcat_workers_self_management:0 "Autogestión obrera"
 hcat_workers_self_management_desc:0 "Las colectividades construyen deprisa, pero cada fábrica aún aprende su oficio por su cuenta."
 hcat_the_supply_committees:0 "Los comités de abastos"
 hcat_the_supply_committees_desc:0 "Los comités de barrio reparten comida y combustible, liberando a las fábricas para la guerra."
 hcat_the_people_in_arms:0 "El pueblo en armas"
 hcat_the_people_in_arms_desc:0 "A las milicias les falta disciplina, pero nunca valor."
 hcat_the_international:0 "La Internacional"
 hcat_the_international_desc:0 "Voluntarios catalanes luchan dondequiera que se alcen los trabajadores, y los anarquistas del mundo vienen a luchar a Cataluña."
 hcat_the_antifascist_front:0 "El Frente Antifascista"
 CAT_principality:0 "Principat de Catalunya"
 CAT_principality_DEF:0 "el Principat de Catalunya"
 CAT_principality_ADJ:0 "catalán"
 CAT_kingdom_of_aragon:0 "Reino de Aragón"
 CAT_kingdom_of_aragon_DEF:0 "el Reino de Aragón"
 CAT_kingdom_of_aragon_ADJ:0 "aragonés"
 hcat_proclaim_the_kingdom_of_aragon:0 "Proclamar el Reino de Aragón"
 hcat_proclaim_the_kingdom_of_aragon_desc:0 "Cataluña, Aragón, Valencia y Mallorca vuelven a estar unidas bajo una misma corona. El Principado puede tomar el nombre del reino que ahora gobierna: el Reino de Aragón."
 hcat_rename_to_kingdom_of_aragon_tt:0 "El país pasa a llamarse §YReino de Aragón§!."
