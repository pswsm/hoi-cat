 SPR_hcat_the_catalan_question:0 "La cuestión catalana"
 SPR_hcat_the_catalan_question_desc:0 "Barcelona se gobierna a sí misma bajo el Estatuto de 1932. Ningún gobierno español puede eludir la pregunta de si ese acuerdo fortalece España o la divide."
 SPR_hcat_the_generalitat_and_the_republic:0 "La Generalitat y la República"
 SPR_hcat_the_generalitat_and_the_republic_desc:0 "La República otorgó a Cataluña su Estatuto. Ahora debe decidir qué es para ella la Generalitat: un socio o un rival."
 SPR_hcat_honour_the_statute:0 "Respetar el Estatuto"
 SPR_hcat_honour_the_statute_desc:0 "La República cumple su palabra. Las competencias de la Generalitat se respetarán por completo."
 SPR_hcat_partners_in_the_war_effort:0 "Socios en el esfuerzo de guerra"
 SPR_hcat_partners_in_the_war_effort_desc:0 "La industria catalana, organizada por la Generalitat, armará a la República."
 SPR_hcat_recentralise_the_republic:0 "Recentralizar la República"
 SPR_hcat_recentralise_the_republic_desc:0 "Una República dividida no puede vencer. La autoridad debe volver al gobierno central."
 SPR_hcat_restore_public_order:0 "Restablecer el orden público en Barcelona"
 SPR_hcat_restore_public_order_desc:0 "Las calles de Barcelona responden a demasiados amos. La Guardia de Asalto asumirá el orden público en lugar de la Generalitat."
 SPR_hcat_against_separatism:0 "Contra el separatismo"
 SPR_hcat_against_separatism_desc:0 "España es una sola nación. El separatismo catalán es enemigo de la Patria."
 SPR_hcat_abolish_the_statute:0 "Abolir el Estatuto"
 SPR_hcat_abolish_the_statute_desc:0 "Se revoca el Estatuto de Autonomía y se disuelve la Generalitat."
 SPR_hcat_one_spain:0 "Una sola España"
 SPR_hcat_one_spain_desc:0 "Un Estado, una lengua, una administración desde Madrid."
 SPR_hcat_integrate_catalonia:0 "Integrar Cataluña"
 SPR_hcat_integrate_catalonia_desc:0 "Cataluña se gobernará como cualquier otra parte de España. El resentimiento perdurará durante años."
 hcat_autonomy_change_tt:0 "Autonomía catalana: $RIGHT|+0$"
