l_english:
 hcat_catalan_question:0 "The Catalan Question"
 hcat_catalan_question_desc:0 "The relationship between Catalonia and the Spanish state remains unresolved.\n\nCatalan autonomy: §Y[?global.hcat_autonomy|0]§! / 100\n§YGuaranteed minimum:§! [?global.hcat_autonomy_floor|0]"
 hcat_debug_raise_autonomy:0 "[DEBUG] Raise Catalan autonomy"
 hcat_debug_lower_autonomy:0 "[DEBUG] Lower Catalan autonomy"
 CAT_the_catalan_question:0 "The Catalan Question"
 CAT_the_catalan_question_desc:0 "Catalonia must decide its place in, or outside of, Spain."
 CAT_the_road_to_independence:0 "The Road to Independence"
 CAT_the_road_to_independence_desc:0 "Only a sovereign Catalonia can secure the future of the Catalan nation."
 CAT_mediterranean_democracy:0 "A Mediterranean Democracy"
 CAT_mediterranean_democracy_desc:0 "A free republic, open to the sea and to the democracies of Europe."
 CAT_restore_the_crown_of_aragon:0 "Restore the Crown of Aragó"
 CAT_restore_the_crown_of_aragon_desc:0 "The lands of the old Crown shall be united once more."
 CAT_home_of_anarchy:0 "Home of Anarchy"
 CAT_home_of_anarchy_desc:0 "Barcelona, the rose of fire, will show the world a society without masters."
 CAT_within_spain:0 "Within Spain"
 CAT_within_spain_desc:0 "Catalonia's interests are best served by its autonomy inside the Spanish state."
 hcat_autonomy_autonomous_community:0 "Autonomous Community"
 CAT_hcat_autonomy_autonomous_community:0 "Generalitat de Catalunya"
 CAT_hcat_autonomy_autonomous_community_DEF:0 "the Generalitat de Catalunya"
 hcat_catalonia_is_our_subject_tt:0 "§YCatalonia§! is our subject"
 hcat_autonomy_low_enough_to_integrate_tt:0 "Catalan autonomy is at most §Y25§! (currently §Y[?global.hcat_autonomy|0]§!)"
 hcat_catalan_discontent_country:0 "Catalan Discontent"
 hcat_catalan_discontent_state:0 "Catalan Discontent"
 SPR_hcat_the_catalan_question:0 "The Catalan Question"
 SPR_hcat_the_catalan_question_desc:0 "Barcelona governs itself under the Statute of 1932. Whether that arrangement strengthens Spain or divides it is a question no Spanish government can avoid."
 SPR_hcat_the_generalitat_and_the_republic:0 "The Generalitat and the Republic"
 SPR_hcat_the_generalitat_and_the_republic_desc:0 "The Republic granted Catalonia its Statute. Now it must decide what the Generalitat is to it: a partner or a rival."
 SPR_hcat_honour_the_statute:0 "Honour the Statute"
 SPR_hcat_honour_the_statute_desc:0 "The Republic keeps its word. The Generalitat's powers will be respected in full."
 SPR_hcat_partners_in_the_war_effort:0 "Partners in the War Effort"
 SPR_hcat_partners_in_the_war_effort_desc:0 "Catalan industry, organised by the Generalitat, will arm the Republic."
 SPR_hcat_recentralise_the_republic:0 "Recentralise the Republic"
 SPR_hcat_recentralise_the_republic_desc:0 "A divided Republic cannot win. Authority must return to the central government."
 SPR_hcat_restore_public_order:0 "Restore Public Order in Barcelona"
 SPR_hcat_restore_public_order_desc:0 "The streets of Barcelona answer to too many masters. The Assault Guards will take over public order from the Generalitat."
 SPR_hcat_against_separatism:0 "Against Separatism"
 SPR_hcat_against_separatism_desc:0 "Spain is one nation. Catalan separatism is an enemy of the Fatherland."
 SPR_hcat_abolish_the_statute:0 "Abolish the Statute"
 SPR_hcat_abolish_the_statute_desc:0 "The Statute of Autonomy is revoked and the Generalitat dissolved."
 SPR_hcat_one_spain:0 "One Spain"
 SPR_hcat_one_spain_desc:0 "One state, one language, one administration from Madrid."
 SPR_hcat_integrate_catalonia:0 "Integrate Catalonia"
 SPR_hcat_integrate_catalonia_desc:0 "Catalonia will be governed as any other part of Spain. Resentment will linger for years."
 hcat_autonomy_change_tt:0 "Catalan autonomy: $RIGHT|+0$"
 CAT_mobilise_civil_society:0 "Mobilise Civil Society"
 CAT_mobilise_civil_society_desc:0 "Òmnium, the ateneus and the unions: Catalan society must stand behind the cause of self-rule."
 CAT_proclaim_the_catalan_state:0 "Proclaim the Catalan State"
 CAT_proclaim_the_catalan_state_desc:0 "From the balcony of the Palau de la Generalitat, the Catalan State is proclaimed. Madrid must now answer."
 CAT_the_statute_defended:0 "The Statute Defended"
 CAT_the_statute_defended_desc:0 "The Statute is the Catalan people's guarantee. Any government in Madrid that touches it will face all of Catalonia."
 CAT_industry_of_the_republic:0 "Industry of the Republic"
 CAT_industry_of_the_republic_desc:0 "Within Spain, Catalan industry can grow with access to Spanish markets."
 hcat_unlocks_mobilise_decision_tt:0 "Unlocks the decision §YMobilise Civil Society§!."
 hcat_autonomy_high_enough_to_proclaim_tt:0 "Catalan autonomy is at least §Y80§! (currently §Y[?global.hcat_autonomy|0]§!)"
 hcat_autonomy_floor_30_tt:0 "Catalan autonomy can no longer fall below §Y30§! while the Statute stands."
 hcat_autonomy_floor_40_tt:0 "Catalan autonomy can no longer fall below §Y40§! while the Statute stands."
 hcat_break_the_statute_pact_tt:0 "§RBreaks the Statute guarantee:§! Catalan autonomy is no longer protected."
 hcat_proclaim_the_catalan_state_tt:0 "§YSpain§! must decide whether to accept the Catalan State or crush it."
 hcat_negotiate_competences:0 "Negotiate Competences"
 hcat_negotiate_competences_desc:0 "Press Madrid to transfer new powers to the Generalitat."
 hcat_mobilise_civil_society:0 "Mobilise Civil Society"
 hcat_mobilise_civil_society_desc:0 "Rallies, strikes and petitions show Madrid that Catalonia will not back down."
 hcat_spain.1.t:0 "Catalonia Proclaims the Catalan State"
 hcat_spain.1.desc:0 "The President of the Generalitat has proclaimed the Catalan State from the balcony of the Palau, and the crowd in the Plaça de Sant Jaume is cheering. Catalonia no longer recognises the authority of the Spanish government.\n\nWe can accept this and negotiate a separation, or send the army to restore the unity of Spain."
 hcat_spain.1.a:0 "Let Catalonia go."
 hcat_spain.1.b:0 "The unity of Spain is not negotiable!"
 hcat_catalonia.1.t:0 "Madrid Accepts"
 hcat_catalonia.1.desc:0 "To the surprise of many, the Spanish government has accepted the proclamation. Catalonia is free to chart its own course."
 hcat_catalonia.1.a:0 "Visca Catalunya lliure!"
 hcat_catalonia.2.t:0 "Madrid Sends the Army"
 hcat_catalonia.2.desc:0 "The Spanish government has refused to recognise the Catalan State and its troops are marching on Catalonia. Our independence will have to be won."
 hcat_catalonia.2.a:0 "To arms!"
 hcat_catalonia.3.t:0 "The Statute Betrayed"
 hcat_catalonia.3.desc:0 "Madrid has torn up the guarantees of the Statute of Autonomy. The self-government we defended is now at the mercy of the Spanish government."
 hcat_catalonia.3.a:0 "We will not forget this."
 CAT_the_parliament_of_catalonia:0 "The Parliament of Catalonia"
 CAT_the_parliament_of_catalonia_desc:0 "The Parliament elected under the Statute is now the sovereign voice of the Catalan people. Its sessions must give the new republic a firm footing."
 CAT_the_rabassaires_law:0 "The Rabassaires Law"
 CAT_the_rabassaires_law_desc:0 "The Law of Cultivation Contracts, struck down by Madrid in 1934, can finally take effect. The sharecroppers of the vineyards will own the land they work."
 CAT_a_republic_of_citizens:0 "A Republic of Citizens"
 CAT_a_republic_of_citizens_desc:0 "Schools, a free press and civil liberties: the Catalan Republic will be built by its citizens, not imposed on its subjects."
 CAT_the_port_of_barcelona:0 "The Port of Barcelona"
 CAT_the_port_of_barcelona_desc:0 "Barcelona has always lived from the sea. Its harbour and shipyards will be the gateway of the new state."
 CAT_the_factory_of_the_mediterranean:0 "The Factory of the Mediterranean"
 CAT_the_factory_of_the_mediterranean_desc:0 "Catalonia was the factory of Spain. Free of Madrid's tariffs, it can be the factory of the whole Mediterranean."
 CAT_mediterranean_trade:0 "Mediterranean Trade"
 CAT_mediterranean_trade_desc:0 "From Marseille to Alexandria, Catalan merchants once ruled these waters. New treaties will open the old routes again."
 CAT_seek_recognition:0 "Seek International Recognition"
 CAT_seek_recognition_desc:0 "A state exists when others treat it as one. Our envoys will knock on the doors of the democracies of Europe and America."
 CAT_the_army_of_catalonia:0 "The Army of Catalonia"
 CAT_the_army_of_catalonia_desc:0 "The militias and the Mossos d'Esquadra must become a real army, one of citizen soldiers loyal to the republic."
 CAT_hold_the_ebro_and_the_pyrenees:0 "Hold the Ebro and the Pyrenees"
 CAT_hold_the_ebro_and_the_pyrenees_desc:0 "A small nation survives by making itself costly to invade. The river lines and mountain passes will be fortified."
 CAT_entente_with_france:0 "Entente with France"
 CAT_entente_with_france_desc:0 "Paris is our closest friend and our strongest neighbour. An alliance with France will keep Madrid's ambitions in check."
 CAT_the_mediterranean_accord:0 "The Mediterranean Accord"
 CAT_the_mediterranean_accord_desc:0 "We will not be anyone's junior partner. The small democracies of the Mediterranean can stand together on their own terms."
 CAT_the_beacon_of_the_mediterranean:0 "The Beacon of the Mediterranean"
 CAT_the_beacon_of_the_mediterranean_desc:0 "Prosperous, free and secure, Catalonia stands as proof that a small nation can be a great democracy."
 hcat_fragile_republic:0 "A Fragile Republic"
 hcat_fragile_republic_desc:0 "The new Catalan Republic has institutions on paper, but few of them have been tested. Factions quarrel and the civil service is still learning to govern a state."
 hcat_republic_finds_its_feet:0 "A Republic Finds Its Feet"
 hcat_republic_finds_its_feet_desc:0 "Parliament sits, laws are passed and the ministries are taking shape. The republic is still young, but it is working."
 hcat_a_republic_of_citizens:0 "A Republic of Citizens"
 hcat_a_republic_of_citizens_desc:0 "Catalans have come to see the republic as their own. Its institutions are trusted, and its citizens are ready to defend them."
 hcat_the_rabassaires_law:0 "The Rabassaires Law"
 hcat_the_rabassaires_law_desc:0 "The sharecroppers have the security of the land they work, and the countryside is loyal to the republic that gave it to them."
 hcat_mediterranean_trade_routes:0 "Mediterranean Trade Routes"
 hcat_mediterranean_trade_routes_desc:0 "Catalan goods flow through the ports of the Mediterranean, and foreign capital flows back to Barcelona."
 hcat_a_citizen_army:0 "A Citizen Army"
 hcat_a_citizen_army_desc:0 "Catalonia's soldiers know what they are fighting for: their homes and their republic."
 hcat_recognised_the_catalan_republic:0 "Recognised the Catalan Republic"
 hcat_the_mediterranean_accord:0 "The Mediterranean Accord"
 hcat_raise_the_catalan_forces_tt:0 "§YThe Catalan forces are raised in Barcelona:§!\n- 3 divisions of §YMilícies Catalanes§!\n- 2 divisions of §YMossos d'Esquadra§! with military police\n- The mountain division §YRegiment Pirinenc núm. 1§!"
 CAT_the_count_of_barcelona:0 "The Count of Barcelona"
 CAT_the_count_of_barcelona_desc:0 "The kings of Aragon were first of all Counts of Barcelona. The restored Crown needs a Count-King, and more than one house has a claim to the title."
 CAT_the_corts_generals:0 "The Corts Generals"
 CAT_the_corts_generals_desc:0 "For centuries the king could not rule without the Corts, where the estates of each kingdom voted his taxes and his laws. The restored Crown will be bound by them again."
 CAT_the_usatges_of_barcelona:0 "The Usatges of Barcelona"
 CAT_the_usatges_of_barcelona_desc:0 "The old customary law of the Principality gives the Crown its rights over its lands. Lawyers in Barcelona are busy finding the precedents for every claim."
 CAT_the_lands_of_the_crown:0 "The Lands of the Crown"
 CAT_the_lands_of_the_crown_desc:0 "Aragon, Valencia and Majorca were kingdoms of the Crown long before there was a Spain. They belong with us."
 CAT_reclaim_aragon:0 "Reclaim Aragon"
 CAT_reclaim_aragon_desc:0 "Zaragoza was the seat of the Crown's kings. Aragon must return to the Crown that bears its name."
 CAT_reclaim_valencia_and_the_isles:0 "Reclaim Valencia and the Isles"
 CAT_reclaim_valencia_and_the_isles_desc:0 "The Kingdom of Valencia and the Kingdom of Majorca speak our language and share our history. They will be part of the Crown again."
 CAT_the_crown_united:0 "The Crown United"
 CAT_the_crown_united_desc:0 "For the first time since 1714, the lands of the Crown of Aragon are free and ruled from one throne."
 CAT_the_almogavars:0 "The Almogàvers"
 CAT_the_almogavars_desc:0 "The almogàvers, the light infantry of the Crown, fought their way from the Pyrenees to Athens. Our soldiers will be trained in their spirit."
 CAT_the_consulate_of_the_sea:0 "The Consulate of the Sea"
 CAT_the_consulate_of_the_sea_desc:0 "The Llibre del Consolat de Mar was the maritime law of the whole Mediterranean. Barcelona will once again be a power at sea."
 CAT_northern_catalonia:0 "Northern Catalonia"
 CAT_northern_catalonia_desc:0 "Roussillon was handed to France in 1659 by a treaty no Catalan signed. The counties north of the Pyrenees are still Catalan."
 CAT_the_mediterranean_kingdoms:0 "The Mediterranean Kingdoms"
 CAT_the_mediterranean_kingdoms_desc:0 "Sardinia, Sicily and Naples were all once ruled from Barcelona. The Crown will remember its old kingdoms across the sea."
 CAT_the_crown_of_aragon_reborn:0 "The Crown of Aragon Reborn"
 CAT_the_crown_of_aragon_reborn_desc:0 "The Crown is restored in its lands, its laws and its sea. The four bars fly again over the Mediterranean."
 CAT_juan_de_borbon:0 "Juan de Borbón"
 hcat_a_disputed_crown:0 "A Disputed Crown"
 hcat_a_disputed_crown_desc:0 "Many in Catalonia doubt that a medieval crown can be restored in the twentieth century, and republicans and monarchists eye each other with suspicion."
 hcat_the_corts_of_the_crown:0 "The Corts of the Crown"
 hcat_the_corts_of_the_crown_desc:0 "The king rules with the Corts, and the Corts with the king. The old pact gives the restored monarchy its legitimacy."
 hcat_the_crown_of_aragon_reborn:0 "The Crown of Aragon Reborn"
 hcat_the_crown_of_aragon_reborn_desc:0 "The Crown is restored, and its people are proud of it."
 hcat_the_usatges_of_barcelona:0 "The Usatges of Barcelona"
 hcat_the_usatges_of_barcelona_desc:0 "Ancient law gives the Crown a claim to every land it once ruled, and its people the will to press them."
 hcat_the_almogavars:0 "The Almogàvers"
 hcat_the_almogavars_desc:0 "Catalan soldiers are trained to strike fast and hard, like the almogàvers of old."
 hcat_the_consulate_of_the_sea:0 "The Consulate of the Sea"
 hcat_the_consulate_of_the_sea_desc:0 "Barcelona's shipyards and merchants are once again the heart of Mediterranean trade."
 hcat_choose_a_claimant_tt:0 "§YThe Corts will crown the claimant with the most support.§! While the focus is in progress, events will let you sway them."
 CAT_ramon_berenguer:0 "Ramon Berenguer de Barcelona"
 CAT_otto_von_habsburg:0 "Otto von Habsburg"
 CAT_jaume_d_urgell:0 "Jaume d'Urgell"
 hcat_catalonia.4.t:0 "The Corts Have Chosen"
 hcat_catalonia.4.a:0 "Long live King Juan!"
 hcat_catalonia.4.b:0 "Long live the Count-King!"
 hcat_catalonia.4.c:0 "Long live King Otto!"
 hcat_catalonia.4.d:0 "Long live King Jaume!"
 hcat_house_of_bourbon:0 "A Bourbon Count of Barcelona"
 hcat_house_of_bourbon_desc:0 "A Bourbon sits on the throne of Barcelona. Madrid is reassured, but many Catalans have not forgotten 1714."
 hcat_house_of_barcelona:0 "The House of Barcelona Refounded"
 hcat_house_of_barcelona_desc:0 "A Catalan wears the Crown again, chosen by the Corts as in the days of the Counts. The nation rallies to him, though his court is small and his treasury smaller."
 hcat_house_of_habsburg:0 "The Austrian Candidate"
 hcat_house_of_habsburg_desc:0 "Two centuries late, the Habsburg claim Catalonia fought for has come true. Austrian officers and courtiers have followed the new king, but to many he is a foreigner."
 hcat_house_of_urgell:0 "The Heir of Urgell"
 hcat_house_of_urgell_desc:0 "The wrong of Caspe has been righted, and the new king means to recover everything the Crown ever lost. Not everyone is convinced by his genealogy."
 hcat_a_bourbon_in_barcelona:0 "A Bourbon in Barcelona"
 hcat_a_habsburg_in_barcelona:0 "A Habsburg in Barcelona"
 hcat_habsburg_restoration:0 "Habsburg restoration"
 hcat_claim_bourbon_tt:0 "Support for the House of Bourbon: $RIGHT|+0$"
 hcat_claim_barcelona_tt:0 "Support for the House of Barcelona: $RIGHT|+0$"
 hcat_claim_habsburg_tt:0 "Support for the House of Habsburg: $RIGHT|+0$"
 hcat_claim_urgell_tt:0 "Support for the House of Urgell: $RIGHT|+0$"
 hcat_catalonia.4.desc_bourbon:0 "After weeks of debate, the Corts have offered the Crown to Juan de Borbón, Count of Barcelona. A Bourbon will reign in Barcelona again, and Madrid has sent its congratulations."
 hcat_catalonia.4.desc_barcelona:0 "The Corts have refused every foreign house. As in the days of the first Counts, they have chosen one of their own: Ramon Berenguer de Barcelona will refound the House of Barcelona."
 hcat_catalonia.4.desc_habsburg:0 "Two centuries after Catalonia fought for Archduke Charles, the Corts have offered the Crown to his heir. Otto von Habsburg is on his way from Belgium."
 hcat_catalonia.4.desc_urgell:0 "The Corts have voted to undo the Compromise of Caspe. The heir of Jaume d'Urgell, the count passed over in 1412, will at last take the throne his line was denied."
 hcat_crown.1.t:0 "Envoys from the Count of Barcelona"
 hcat_crown.1.desc:0 "Envoys of Juan de Borbón have arrived in Barcelona. The Count, they say, would honour the liberties of the Crown and bring the goodwill of Madrid with him.\n\nNot everyone is convinced: it was the first Bourbon king who abolished those same liberties in 1714.\n\n§YSupport in the Corts§!\nBourbon: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburg: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.1.a:0 "Receive them with honours."
 hcat_crown.1.b:0 "Remind them of 1714."
 hcat_crown.2.t:0 "A Letter from Steenokkerzeel"
 hcat_crown.2.desc:0 "From his exile in Belgium, Otto von Habsburg has written to the Corts. He recalls that Catalonia stood by his house in the War of the Spanish Succession, and offers to finish what Archduke Charles began.\n\n§YSupport in the Corts§!\nBourbon: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburg: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.2.a:0 "Publish the letter in the press."
 hcat_crown.2.b:0 "File it away politely."
 hcat_crown.3.t:0 "The Historians' Quarrel"
 hcat_crown.3.desc:0 "At the Institut d'Estudis Catalans, the historians cannot agree. Some call the Compromise of Caspe a usurpation, and the heir of Urgell the rightful king. Others say the first Counts were chosen by their people, and the Corts may choose again. A third group says only that a crown needs a royal house.\n\n§YSupport in the Corts§!\nBourbon: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburg: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.3.a:0 "Caspe was a usurpation."
 hcat_crown.3.b:0 "The first Counts were chosen by their people."
 hcat_crown.3.c:0 "A crown needs a royal house, not a theory."
 hcat_crown.4.t:0 "The Industrialists Speak"
 hcat_crown.4.desc:0 "The Foment del Treball Nacional, voice of Barcelona's industrialists, wants a king with friends abroad who will keep markets open. The radicals in the Corts answer that Catalonia did not free itself to be ruled from a foreign court.\n\n§YSupport in the Corts§!\nBourbon: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburg: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.4.a:0 "Side with the industrialists."
 hcat_crown.4.b:0 "Side with the radicals."
 hcat_crown.5.t:0 "The Corts Deliberate"
 hcat_crown.5.desc:0 "The Corts will vote within days. The government can let the deputies decide freely, or spend its influence to win votes for one house.\n\n§YSupport in the Corts§!\nBourbon: §Y[?ROOT.hcat_claim_bourbon|0]§!\nBarcelona: §Y[?ROOT.hcat_claim_barcelona|0]§!\nHabsburg: §Y[?ROOT.hcat_claim_habsburg|0]§!\nUrgell: §Y[?ROOT.hcat_claim_urgell|0]§!"
 hcat_crown.5.a:0 "Let the Corts vote freely."
 hcat_crown.5.b:0 "Win votes for the House of Bourbon."
 hcat_crown.5.c:0 "Win votes for the House of Barcelona."
 hcat_crown.5.d:0 "Win votes for the House of Habsburg."
 hcat_crown.5.e:0 "Win votes for the House of Urgell."
 CAT_libertarian_communism:0 "Libertarian Communism"
 CAT_libertarian_communism_desc:0 "The CNT's Zaragoza congress set out the goal in May: free communes, federated from below, with no state above them. In Catalonia, that goal is now within reach."
 CAT_the_modern_school:0 "The Modern School"
 CAT_the_modern_school_desc:0 "Francesc Ferrer i Guàrdia founded his rationalist Escola Moderna in Barcelona in 1901 and was shot for it. His schools will open again, free of church and state."
 CAT_mujeres_libres:0 "Mujeres Libres"
 CAT_mujeres_libres_desc:0 "The Free Women organise in the factories and the neighbourhoods. A revolution that leaves half the people behind is no revolution at all."
 CAT_the_free_federation:0 "The Free Federation"
 CAT_the_free_federation_desc:0 "Committees, collectives and communes are bound together in one free federation. Catalonia governs itself from below."
 CAT_the_collectives:0 "The Collectives"
 CAT_the_collectives_desc:0 "The owners have fled, and the workers have taken over the factories, the trams and the telephone exchange. They will run them themselves."
 CAT_the_council_of_economy:0 "The Council of Economy"
 CAT_the_council_of_economy_desc:0 "The Consell d'Economia de Catalunya will coordinate the collectives so that every factory knows what the others need."
 CAT_the_war_industries_commission:0 "The War Industries Commission"
 CAT_the_war_industries_commission_desc:0 "Textile mills and car works can be turned to making rifles and shells. The Comissió d'Indústries de Guerra will arm the revolution."
 CAT_the_supply_committees:0 "The Supply Committees"
 CAT_the_supply_committees_desc:0 "Neighbourhood committees will see that bread and coal reach every home, with no profiteers in between."
 CAT_the_militia_columns:0 "The Militia Columns"
 CAT_the_militia_columns_desc:0 "The workers who stormed the barracks in July have formed columns of their own. They elect their delegates and need no generals."
 CAT_the_aragon_front:0 "The Aragon Front"
 CAT_the_aragon_front_desc:0 "The columns march west, and in every Aragonese village they reach the peasants found collectives of their own."
 CAT_the_antifascist_front:0 "The Antifascist Front"
 CAT_the_antifascist_front_desc:0 "Fascism is the enemy of every free people. We will stand with anyone who fights it."
 CAT_the_international_workers_association:0 "The International Workers' Association"
 CAT_the_international_workers_association_desc:0 "Our revolution belongs to the workers of the world. Through the IWA, comrades from every country will come to fight with us, and we will go to fight with them."
 CAT_the_rose_of_fire:0 "The Rose of Fire"
 CAT_the_rose_of_fire_desc:0 "Barcelona, la rosa de foc, has shown the world that a society without masters can work, and fight."
 CAT_the_central_committee_of_militias:0 "Central Committee of Antifascist Militias"
 hcat_raise_the_militia_columns_tt:0 "§YThe columns are raised in Barcelona:§! §YColumna Durruti§!, §YColumna Ascaso§! and §YColumna Ortiz§!."
 hcat_the_july_revolution:0 "The July Revolution"
 hcat_the_july_revolution_desc:0 "The old order collapsed in a few days of street fighting. Committees run the city, but nobody is sure who is in charge."
 hcat_the_free_communes:0 "The Free Communes"
 hcat_the_free_communes_desc:0 "Towns and neighbourhoods govern themselves through open assemblies. It is slow and quarrelsome, but it works."
 hcat_the_free_federation:0 "The Free Federation"
 hcat_the_free_federation_desc:0 "The communes are federated, and the revolution has the structure it needs to last."
 hcat_the_rose_of_fire:0 "The Rose of Fire"
 hcat_the_rose_of_fire_desc:0 "Revolutionary Catalonia is united, productive and ready to defend itself."
 hcat_the_modern_school:0 "The Modern School"
 hcat_the_modern_school_desc:0 "Rationalist schools teach children to think for themselves, and the universities are open to workers."
 hcat_mujeres_libres:0 "Mujeres Libres"
 hcat_mujeres_libres_desc:0 "Women work in the factories, serve in the militias and sit on the committees."
 hcat_workers_self_management:0 "Workers' Self-Management"
