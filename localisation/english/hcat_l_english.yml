l_english:
 hcat_catalan_question:0 "The Catalan Question"
 hcat_catalan_question_desc:0 "The relationship between Catalonia and the Spanish state remains unresolved.\n\nCatalan autonomy: §Y[?global.hcat_autonomy|0]§! / 100\n§YGuaranteed minimum:§! [?global.hcat_autonomy_floor|0]"
 hcat_debug_raise_autonomy:0 "[DEBUG] Raise Catalan autonomy"
 hcat_debug_lower_autonomy:0 "[DEBUG] Lower Catalan autonomy"
 CAT_the_catalan_question:0 "The Catalan Question"
 CAT_the_catalan_question_desc:0 "Catalonia must decide its place in, or outside of, Spain."
 CAT_the_road_to_independence:0 "The Road to Independence"
 CAT_the_road_to_independence_desc:0 "Only a sovereign Catalonia can secure the future of the Catalan nation."
 CAT_mediterranean_democracy:0 "A Mediterranean Democracy"
 CAT_mediterranean_democracy_desc:0 "A free republic, open to the sea and to the democracies of Europe."
 CAT_restore_the_crown_of_aragon:0 "Restore the Crown of Aragó"
 CAT_restore_the_crown_of_aragon_desc:0 "The lands of the old Crown shall be united once more."
 CAT_home_of_anarchy:0 "Home of Anarchy"
 CAT_home_of_anarchy_desc:0 "Barcelona, the rose of fire, will show the world a society without masters."
 CAT_within_spain:0 "Within Spain"
 CAT_within_spain_desc:0 "Catalonia's interests are best served by its autonomy inside the Spanish state."
 hcat_autonomy_autonomous_community:0 "Autonomous Community"
 CAT_hcat_autonomy_autonomous_community:0 "Generalitat de Catalunya"
 CAT_hcat_autonomy_autonomous_community_DEF:0 "the Generalitat de Catalunya"
 hcat_catalonia_is_our_subject_tt:0 "§YCatalonia§! is our subject"
 hcat_autonomy_low_enough_to_integrate_tt:0 "Catalan autonomy is at most §Y25§! (currently §Y[?global.hcat_autonomy|0]§!)"
 hcat_catalan_discontent_country:0 "Catalan Discontent"
 hcat_catalan_discontent_state:0 "Catalan Discontent"
 SPR_hcat_the_catalan_question:0 "The Catalan Question"
 SPR_hcat_the_catalan_question_desc:0 "Barcelona governs itself under the Statute of 1932. Whether that arrangement strengthens Spain or divides it is a question no Spanish government can avoid."
 SPR_hcat_the_generalitat_and_the_republic:0 "The Generalitat and the Republic"
 SPR_hcat_the_generalitat_and_the_republic_desc:0 "The Republic granted Catalonia its Statute. Now it must decide what the Generalitat is to it: a partner or a rival."
 SPR_hcat_honour_the_statute:0 "Honour the Statute"
 SPR_hcat_honour_the_statute_desc:0 "The Republic keeps its word. The Generalitat's powers will be respected in full."
 SPR_hcat_partners_in_the_war_effort:0 "Partners in the War Effort"
 SPR_hcat_partners_in_the_war_effort_desc:0 "Catalan industry, organised by the Generalitat, will arm the Republic."
 SPR_hcat_recentralise_the_republic:0 "Recentralise the Republic"
 SPR_hcat_recentralise_the_republic_desc:0 "A divided Republic cannot win. Authority must return to the central government."
 SPR_hcat_restore_public_order:0 "Restore Public Order in Barcelona"
 SPR_hcat_restore_public_order_desc:0 "The streets of Barcelona answer to too many masters. The Assault Guards will take over public order from the Generalitat."
 SPR_hcat_against_separatism:0 "Against Separatism"
 SPR_hcat_against_separatism_desc:0 "Spain is one nation. Catalan separatism is an enemy of the Fatherland."
 SPR_hcat_abolish_the_statute:0 "Abolish the Statute"
 SPR_hcat_abolish_the_statute_desc:0 "The Statute of Autonomy is revoked and the Generalitat dissolved."
 SPR_hcat_one_spain:0 "One Spain"
 SPR_hcat_one_spain_desc:0 "One state, one language, one administration from Madrid."
 SPR_hcat_integrate_catalonia:0 "Integrate Catalonia"
 SPR_hcat_integrate_catalonia_desc:0 "Catalonia will be governed as any other part of Spain. Resentment will linger for years."
 hcat_autonomy_change_tt:0 "Catalan autonomy: $RIGHT|+0$"
 CAT_mobilise_civil_society:0 "Mobilise Civil Society"
 CAT_mobilise_civil_society_desc:0 "Òmnium, the ateneus and the unions: Catalan society must stand behind the cause of self-rule."
 CAT_proclaim_the_catalan_state:0 "Proclaim the Catalan State"
 CAT_proclaim_the_catalan_state_desc:0 "From the balcony of the Palau de la Generalitat, the Catalan State is proclaimed. Madrid must now answer."
 CAT_the_statute_defended:0 "The Statute Defended"
 CAT_the_statute_defended_desc:0 "The Statute is the Catalan people's guarantee. Any government in Madrid that touches it will face all of Catalonia."
 CAT_industry_of_the_republic:0 "Industry of the Republic"
 CAT_industry_of_the_republic_desc:0 "Within Spain, Catalan industry can grow with access to Spanish markets."
 hcat_unlocks_mobilise_decision_tt:0 "Unlocks the decision §YMobilise Civil Society§!."
 hcat_autonomy_high_enough_to_proclaim_tt:0 "Catalan autonomy is at least §Y80§! (currently §Y[?global.hcat_autonomy|0]§!)"
 hcat_autonomy_floor_30_tt:0 "Catalan autonomy can no longer fall below §Y30§! while the Statute stands."
 hcat_autonomy_floor_40_tt:0 "Catalan autonomy can no longer fall below §Y40§! while the Statute stands."
 hcat_break_the_statute_pact_tt:0 "§RBreaks the Statute guarantee:§! Catalan autonomy is no longer protected."
 hcat_proclaim_the_catalan_state_tt:0 "§YSpain§! must decide whether to accept the Catalan State or crush it."
 hcat_negotiate_competences:0 "Negotiate Competences"
 hcat_negotiate_competences_desc:0 "Press Madrid to transfer new powers to the Generalitat."
 hcat_mobilise_civil_society:0 "Mobilise Civil Society"
 hcat_mobilise_civil_society_desc:0 "Rallies, strikes and petitions show Madrid that Catalonia will not back down."
 hcat_spain.1.t:0 "Catalonia Proclaims the Catalan State"
 hcat_spain.1.desc:0 "The President of the Generalitat has proclaimed the Catalan State from the balcony of the Palau, and the crowd in the Plaça de Sant Jaume is cheering. Catalonia no longer recognises the authority of the Spanish government.\n\nWe can accept this and negotiate a separation, or send the army to restore the unity of Spain."
 hcat_spain.1.a:0 "Let Catalonia go."
 hcat_spain.1.b:0 "The unity of Spain is not negotiable!"
 hcat_catalonia.1.t:0 "Madrid Accepts"
 hcat_catalonia.1.desc:0 "To the surprise of many, the Spanish government has accepted the proclamation. Catalonia is free to chart its own course."
 hcat_catalonia.1.a:0 "Visca Catalunya lliure!"
 hcat_catalonia.2.t:0 "Madrid Sends the Army"
 hcat_catalonia.2.desc:0 "The Spanish government has refused to recognise the Catalan State and its troops are marching on Catalonia. Our independence will have to be won."
 hcat_catalonia.2.a:0 "To arms!"
 hcat_catalonia.3.t:0 "The Statute Betrayed"
 hcat_catalonia.3.desc:0 "Madrid has torn up the guarantees of the Statute of Autonomy. The self-government we defended is now at the mercy of the Spanish government."
 hcat_catalonia.3.a:0 "We will not forget this."
 CAT_the_parliament_of_catalonia:0 "The Parliament of Catalonia"
 CAT_the_parliament_of_catalonia_desc:0 "The Parliament elected under the Statute is now the sovereign voice of the Catalan people. Its sessions must give the new republic a firm footing."
 CAT_the_rabassaires_law:0 "The Rabassaires Law"
 CAT_the_rabassaires_law_desc:0 "The Law of Cultivation Contracts, struck down by Madrid in 1934, can finally take effect. The sharecroppers of the vineyards will own the land they work."
 CAT_a_republic_of_citizens:0 "A Republic of Citizens"
 CAT_a_republic_of_citizens_desc:0 "Schools, a free press and civil liberties: the Catalan Republic will be built by its citizens, not imposed on its subjects."
 CAT_the_port_of_barcelona:0 "The Port of Barcelona"
 CAT_the_port_of_barcelona_desc:0 "Barcelona has always lived from the sea. Its harbour and shipyards will be the gateway of the new state."
 CAT_the_factory_of_the_mediterranean:0 "The Factory of the Mediterranean"
 CAT_the_factory_of_the_mediterranean_desc:0 "Catalonia was the factory of Spain. Free of Madrid's tariffs, it can be the factory of the whole Mediterranean."
 CAT_mediterranean_trade:0 "Mediterranean Trade"
 CAT_mediterranean_trade_desc:0 "From Marseille to Alexandria, Catalan merchants once ruled these waters. New treaties will open the old routes again."
 CAT_seek_recognition:0 "Seek International Recognition"
 CAT_seek_recognition_desc:0 "A state exists when others treat it as one. Our envoys will knock on the doors of the democracies of Europe and America."
 CAT_the_army_of_catalonia:0 "The Army of Catalonia"
 CAT_the_army_of_catalonia_desc:0 "The militias and the Mossos d'Esquadra must become a real army, one of citizen soldiers loyal to the republic."
 CAT_hold_the_ebro_and_the_pyrenees:0 "Hold the Ebro and the Pyrenees"
 CAT_hold_the_ebro_and_the_pyrenees_desc:0 "A small nation survives by making itself costly to invade. The river lines and mountain passes will be fortified."
 CAT_entente_with_france:0 "Entente with France"
 CAT_entente_with_france_desc:0 "Paris is our closest friend and our strongest neighbour. An alliance with France will keep Madrid's ambitions in check."
 CAT_the_mediterranean_accord:0 "The Mediterranean Accord"
 CAT_the_mediterranean_accord_desc:0 "We will not be anyone's junior partner. The small democracies of the Mediterranean can stand together on their own terms."
 CAT_the_beacon_of_the_mediterranean:0 "The Beacon of the Mediterranean"
 CAT_the_beacon_of_the_mediterranean_desc:0 "Prosperous, free and secure, Catalonia stands as proof that a small nation can be a great democracy."
 hcat_fragile_republic:0 "A Fragile Republic"
 hcat_fragile_republic_desc:0 "The new Catalan Republic has institutions on paper, but few of them have been tested. Factions quarrel and the civil service is still learning to govern a state."
 hcat_republic_finds_its_feet:0 "A Republic Finds Its Feet"
 hcat_republic_finds_its_feet_desc:0 "Parliament sits, laws are passed and the ministries are taking shape. The republic is still young, but it is working."
 hcat_a_republic_of_citizens:0 "A Republic of Citizens"
 hcat_a_republic_of_citizens_desc:0 "Catalans have come to see the republic as their own. Its institutions are trusted, and its citizens are ready to defend them."
 hcat_the_rabassaires_law:0 "The Rabassaires Law"
 hcat_the_rabassaires_law_desc:0 "The sharecroppers have the security of the land they work, and the countryside is loyal to the republic that gave it to them."
 hcat_mediterranean_trade_routes:0 "Mediterranean Trade Routes"
 hcat_mediterranean_trade_routes_desc:0 "Catalan goods flow through the ports of the Mediterranean, and foreign capital flows back to Barcelona."
 hcat_a_citizen_army:0 "A Citizen Army"
 hcat_a_citizen_army_desc:0 "Catalonia's soldiers know what they are fighting for: their homes and their republic."
 hcat_recognised_the_catalan_republic:0 "Recognised the Catalan Republic"
 hcat_the_mediterranean_accord:0 "The Mediterranean Accord"
 hcat_raise_the_catalan_forces_tt:0 "§YThe Catalan forces are raised in Barcelona:§!\n- 3 divisions of §YMilícies Catalanes§!\n- 2 divisions of §YMossos d'Esquadra§! with military police\n- The mountain division §YRegiment Pirinenc núm. 1§!"
